[project]
name = "sap-patch-day-notifier"
version = "1.0.0"
description = "Detects the monthly SAP Security Patch Day bulletin and emails the notes table via Amazon SES"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # import sorting
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # comprehensions
  "C90",  # mccabe complexity
  "SIM",  # simplify
  "PL",   # pylint rules (function design gates, see CLAUDE-function-design.md)
  "RUF",  # ruff-specific
  "ARG",  # unused arguments
  "FBT",  # boolean trap: no flag arguments
  "PTH",  # use pathlib
  "TID",  # tidy imports
  "S",    # bandit security checks
  "DTZ",  # timezone-aware datetimes
]
ignore = [
  "S101",    # asserts are the point of tests
  "PLR2004", # magic values: the numbers come from the SAP pages and the spec
  "S310",    # urllib with a constructed URL is the transport, by design
  # The SAP pages use typographic dashes and non-breaking spaces; the parsers
  # must match the bytes SAP publishes, not an ASCII approximation.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.pylint]
max-args = 3          # CLAUDE-function-design.md §3
max-statements = 50   # §1
max-branches = 12
max-returns = 6

[tool.ruff.lint.mccabe]
max-complexity = 10   # §2 (nesting budget)

[tool.ruff.lint.per-file-ignores]
# Transport and adapters carry long dictionary payloads and defensive branches.
"src/sap_patch_day/httpclient.py" = ["ARG002"]
# Configuration records legitimately carry booleans as *data*; the code reads
# them once at the boundary and selects a port, never branches mid-flow
# (CLAUDE-function-design.md §3).
"src/sap_patch_day/config.py" = ["FBT001", "FBT002"]
"src/sap_patch_day/models.py" = ["PLR0913"]
# The dry-run CLI prints by design.
"src/sap_patch_day/local_cli.py" = ["T201", "DTZ011", "ARG001"]
# Read-only state keeps the port's signatures so it can be swapped in anywhere.
"src/sap_patch_day/state.py" = ["ARG002"]
# Tests take fixtures and parametrised cases as arguments, run the repo's own
# scripts with subprocess, and import lazily to keep a test readable. None of
# that is production code, so the function-design and bandit gates stop here.
"tests/**" = [
  "S101",
  "S105",
  "S106",
  "S603",
  "S607",
  "T201",
  "PTH123",
  "ARG001",
  "ARG002",
  "ARG005",
  "FBT001",
  "FBT002",
  "FBT003",
  "PLC0415",
  "PLR0913",
  "PLR0917",
  "PLR2004",
  "DTZ001",
  "DTZ005",
]

[tool.ruff.lint.isort]
known-first-party = ["sap_patch_day"]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
extra_checks = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "live: reaches the real support.sap.com pages; opt in with --live or SAP_PATCH_DAY_LIVE=1",
]
